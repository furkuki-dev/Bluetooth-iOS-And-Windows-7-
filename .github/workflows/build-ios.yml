name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Новый push отменяет незавершённую сборку той же ветки
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS (IPA)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project BTFileShare.xcodeproj \
            -scheme BTFileShare \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/BTFileShare.app
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr BTFileShare.ipa Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: BTFileShare-ipa
          path: BTFileShare.ipa
          if-no-files-found: error

  windows:
    name: Windows (32-bit exe)
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.8 (32-bit)
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: x86

      - name: Check interpreter is 32-bit
        run: python -c "import struct, sys; print(sys.version); assert struct.calcsize('P') == 4, 'Python is not 32-bit'"

      - name: Run protocol tests
        run: python -m unittest discover -s windows -p "test_*.py" -v

      - name: Install PyInstaller
        run: python -m pip install "pyinstaller==6.10.0"

      - name: Build 32-bit exe
        run: python -m PyInstaller --onefile --windowed --name BTShare-win32 --paths windows windows/btshare.py

      - uses: actions/upload-artifact@v4
        with:
          name: BTShare-win32
          path: dist/BTShare-win32.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: [ios, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BTFileShare-ipa
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: BTShare-win32
          path: dist

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" dist/BTFileShare.ipa dist/BTShare-win32.exe \
            --repo "${{ github.repository }}" \
            --title "BT Share $TAG" \
            --notes "Автосборка из коммита ${{ github.sha }}"
