name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project BTFileShare.xcodeproj \
            -scheme BTFileShare \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/BTFileShare.app
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr BTFileShare.ipa Payload
          rm -rf Payload

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" BTFileShare.ipa \
            --repo "${{ github.repository }}" \
            --title "BT Share $TAG" \
            --notes "Автосборка из коммита ${{ github.sha }}"
